name: Deploy billingservice.mn

# Deploys the stack to the DigitalOcean droplet and (temporarily) pauses the
# hotel PMS stack that currently occupies ports 80/443.
#   • Manually  : Actions tab → "Deploy billingservice.mn" → "Run workflow"
#   • Automatic : on every push to main
#
# Required secret: DEPLOY_SSH_KEY — private SSH key whose public key is in the
# droplet's ~/.ssh/authorized_keys (same key the HOTEL_PMS repo uses).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: Override target server IP (empty = DEPLOY_HOST var / default)
        required: false
        default: ""
      bootstrap:
        description: One-time new-server setup (needs DEPLOY_PASSWORD secret)
        type: boolean
        required: false
        default: false
      copy_env_from:
        description: Old server IP to copy /opt/billingservice/.env from during bootstrap
        required: false
        default: "168.144.41.111"
      migrate_db_from:
        description: One-time full DB copy from this old server IP (empty = skip). OVERWRITES the target DB.
        required: false
        default: ""
      diag:
        description: Diagnostics only — print migration state and API logs, deploy nothing
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-billing-production
  cancel-in-progress: false

jobs:
  diag:
    name: Server diagnostics
    if: ${{ inputs.diag }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ inputs.host || vars.DEPLOY_HOST || '202.37.235.16' }}
      DEPLOY_USER: root
      DEPLOY_PORT: "22"
    steps:
      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY1 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Collect diagnostics
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOSSH'
          cd /opt/billingservice
          C="docker compose -f docker-compose.prod.yml"
          echo "=== _prisma_migrations ==="
          $C exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT migration_name, started_at, finished_at, rolled_back_at, logs FROM _prisma_migrations ORDER BY started_at;"' || true
          echo "=== Tenant columns ==="
          $C exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT column_name FROM information_schema.columns WHERE table_name='"'"'Tenant'"'"' ORDER BY ordinal_position;"' || true
          echo "=== PaymentIntent columns ==="
          $C exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT column_name FROM information_schema.columns WHERE table_name='"'"'PaymentIntent'"'"' ORDER BY ordinal_position;"' || true
          echo "=== API log head ==="
          $C logs --no-color api 2>/dev/null | head -120 || true
          EOSSH

  deploy:
    name: Deploy to DigitalOcean
    if: ${{ !inputs.diag }}
    runs-on: ubuntu-latest
    env:
      # Production moved to the Mongolia-hosted server (api.ebarimt.mn is
      # geo-restricted to MN address space); the old DO droplet goes back to
      # hotel PMS duty.
      DEPLOY_HOST: ${{ inputs.host || vars.DEPLOY_HOST || '202.37.235.16' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      # Build images on the runner so the small droplet never runs a Docker
      # build — on-droplet builds starve the live API and cause 5xx blips.
      - name: Build images in CI
        run: |
          # Compose interpolates runtime env even for `build`; feed throwaway
          # values so required-var checks pass. They never reach the images —
          # real secrets live only in the droplet's /opt/billingservice/.env.
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-build-only
          JWT_ACCESS_SECRET=ci-build-only
          JWT_REFRESH_SECRET=ci-build-only
          ENCRYPTION_KEY=ci-build-only
          WEBHOOK_SIGNING_SECRET=ci-build-only
          EOF
          docker compose -f docker-compose.prod.yml build api web
          rm -f .env
          docker save billingservice-api billingservice-web | gzip -1 > images.tar.gz
          ls -lh images.tar.gz

      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY1 }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error title=Missing SSH key secret::Add DEPLOY_SSH_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # One-time new-server setup: installs the deploy key via password auth,
      # copies .env from the old server (never printed), probes ebarimt.
      - name: Bootstrap new host
        if: ${{ inputs.bootstrap }}
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          OLD_HOST: ${{ inputs.copy_env_from }}
        run: |
          if [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::Add the new server's root password as the DEPLOY_PASSWORD secret first."; exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys'
          sshpass -p "$DEPLOY_PASSWORD" ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cat >> ~/.ssh/authorized_keys' < ~/.ssh/deploy_key.pub
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" 'echo "✅ key auth OK on $(hostname)"'
          if [ -n "$OLD_HOST" ]; then
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$OLD_HOST" 'cat /opt/billingservice/.env' > env.transfer 2>/dev/null; then
              ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
                'mkdir -p /opt/billingservice && cat > /opt/billingservice/.env && chmod 600 /opt/billingservice/.env' < env.transfer
              rm -f env.transfer
              echo "✅ .env transferred (contents not shown)"
            else
              echo "::warning::Could not read old .env — a fresh one will be generated on first deploy."
            fi
          fi
          CODE=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'curl -s -o /dev/null -w "%{http_code}" -m 15 "https://api.ebarimt.mn/api/info/check/getInfo?regNo=2657457"' || echo ERR)
          echo "ebarimt registry from new host: HTTP $CODE"

      - name: Sync project to droplet
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude 'dist' \
            --exclude '.env' --exclude 'images.tar.gz' \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/billingservice/"

      - name: Ship prebuilt images
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" images.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/billingservice/images.tar.gz"

      - name: Run remote deploy script
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "PUBLIC_URL=https://billing.mastrsys.com bash /opt/billingservice/deploy/remote-deploy.sh"

      # One-time data move: pg_dump on the old server → full restore on the
      # target (drops the target schema first — target data is REPLACED).
      # Only row counts are printed, never data.
      - name: Migrate database from old server
        if: ${{ inputs.migrate_db_from != '' }}
        env:
          OLD_DB_HOST: ${{ inputs.migrate_db_from }}
        run: |
          C="docker compose -f docker-compose.prod.yml"
          echo "→ Dumping database on $OLD_DB_HOST…"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$OLD_DB_HOST" \
            "cd /opt/billingservice && $C exec -T postgres sh -c 'pg_dump -U \"\$POSTGRES_USER\" \"\$POSTGRES_DB\"'" | gzip -1 > dump.sql.gz
          ls -lh dump.sql.gz
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" dump.sql.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/billingservice/dump.sql.gz"
          echo "→ Restoring on $DEPLOY_HOST (api paused during restore)…"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOSSH'
          set -e
          cd /opt/billingservice
          C="docker compose -f docker-compose.prod.yml"
          $C stop api > /dev/null
          $C exec -T postgres sh -c 'psql -q -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
          gunzip -c dump.sql.gz | $C exec -T postgres sh -c 'psql -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > /dev/null
          rm -f dump.sql.gz
          $C start api > /dev/null
          echo "→ Row counts after restore:"
          $C exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SELECT '\''tenants: '\'' || count(*) FROM \"Tenant\"; SELECT '\''users: '\'' || count(*) FROM \"User\"; SELECT '\''invoices: '\'' || count(*) FROM \"Invoice\";"'
          EOSSH
          rm -f dump.sql.gz
          echo "✅ Database migrated."

      - name: Verify public endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://billing.mastrsys.com/health/live > /dev/null 2>&1; then
              echo "✅ https://billing.mastrsys.com is live"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::Public HTTPS endpoint not confirmed yet (cert may still be provisioning)."
