name: Bootstrap new server

# ONE-TIME helper for pointing production at a new server (e.g. a Mongolia-
# hosted box so api.ebarimt.mn is reachable). It:
#   1. installs the existing DEPLOY_SSH_KEY's public key on the new host
#      (password auth via the DEPLOY_PASSWORD secret — add it under
#      Settings → Secrets and variables → Actions, then delete it after)
#   2. copies /opt/billingservice/.env from the old droplet to the new host
#      so QPay/CallPro/admin secrets survive the move without ever being
#      printed anywhere
# After it succeeds, run "Deploy billingservice.mn" with host=<new ip>.

on:
  workflow_dispatch:
    inputs:
      host:
        description: New server IP
        required: true
        default: "202.37.235.16"
      copy_env_from:
        description: Old server IP to copy /opt/billingservice/.env from (empty = skip)
        required: false
        default: "168.144.41.111"

concurrency:
  group: deploy-billing-production
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    env:
      NEW_HOST: ${{ inputs.host }}
      OLD_HOST: ${{ inputs.copy_env_from }}
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Prepare SSH key material
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY1 }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is missing"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          echo "Public key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"

      - name: Install public key on new host (password auth)
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::Add the new server's root password as the DEPLOY_PASSWORD secret first."; exit 1
          fi
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "root@$NEW_HOST" \
            'mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys'
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "root@$NEW_HOST" \
            'cat >> ~/.ssh/authorized_keys' < ~/.ssh/deploy_key.pub
          # From here on, key auth must work:
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$NEW_HOST" 'echo "✅ key auth OK on $(hostname)"'

      - name: Copy .env from old server (never printed)
        if: ${{ inputs.copy_env_from != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$OLD_HOST" \
            'cat /opt/billingservice/.env' > env.transfer 2>/dev/null || { echo "::warning::Could not read old .env — a fresh one will be generated on first deploy."; exit 0; }
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$NEW_HOST" \
            'mkdir -p /opt/billingservice && cat > /opt/billingservice/.env && chmod 600 /opt/billingservice/.env' < env.transfer
          rm -f env.transfer
          echo "✅ .env transferred (contents not shown)"

      - name: Check ebarimt reachability from new host
        run: |
          CODE=$(ssh -i ~/.ssh/deploy_key "root@$NEW_HOST" \
            'curl -s -o /dev/null -w "%{http_code}" -m 15 "https://api.ebarimt.mn/api/info/check/getInfo?regNo=2657457"' || echo ERR)
          echo "ebarimt registry from new host: HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "✅ ebarimt reachable — geo-restriction solved"; else echo "::warning::ebarimt returned $CODE from the new host"; fi
